name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/desktop.py
      - run: node tests/companion.cjs
      - run: python3 tests/packaging.py
      - run: bash -n install.sh
      - run: python3 build.py 1.3.0 dist
