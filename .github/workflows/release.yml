name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric version, for example 1.3.0'
        required: true
      require_all_companions:
        description: 'Require a Mozilla-signed Firefox XPI for automatic setup in all browsers'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/desktop.py && node tests/companion.cjs && python3 tests/packaging.py
      - name: Prepare persistent Chromium signing key
        env:
          SIGNING_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'Set the CRX_PRIVATE_KEY repository secret first'; exit 1; }
          mkdir -p .private
          printf '%s\n' "$SIGNING_KEY" > .private/chromium.pem
          chmod 600 .private/chromium.pem
      - name: Build release assets
        env:
          VERSION: ${{ inputs.version }}
          FIREFOX_XPI_URL: ${{ vars.FIREFOX_SIGNED_XPI_URL }}
          REQUIRE_ALL: ${{ inputs.require_all_companions }}
        run: |
          args=()
          if [ -n "$FIREFOX_XPI_URL" ]; then args+=(--firefox-xpi-url "$FIREFOX_XPI_URL"); fi
          if [ "$REQUIRE_ALL" = true ]; then args+=(--require-companions); else args+=(--preview); fi
          python3 scripts/release.py "$VERSION" --key .private/chromium.pem "${args[@]}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REQUIRE_ALL: ${{ inputs.require_all_companions }}
        run: |
          flags=()
          if [ "$REQUIRE_ALL" != true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Payroll Helper $VERSION" --generate-notes "${flags[@]}"
